<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca FastAPI</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <section class="container">
        <h1>Biblioteca Do Camundugo</h1>

        <div class="card">
            <h2>Novo Livro</h2>

            <form id="formLivro">
                <input type="text" id="titulo" placeholder="Titulo do livro" required>

                <input type="text" id="autor" placeholder="Autor do livro" required>


                <input type="number" id="ano_publicacao" placeholder="Ano de Publicação" required>

                <button type="submit">Adicionar Livro</button>
            </form>

            <div class="card">
                <h2>livros Cadastrados</h2>
                <div id="livrosList"></div>
            </div>

        
        </div>

    </section>


    <script src="js/script.js"></script>
</body>
</html>
